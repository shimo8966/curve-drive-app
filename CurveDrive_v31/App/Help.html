<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CurveDrive 起動の案内</title><style>body{font-family:'Yu Gothic',Meiryo,sans-serif;background:#edf2f7;color:#19304b;margin:0}main{max-width:620px;margin:30px auto;padding:24px}section{background:white;border:2px solid #276b9d;border-radius:14px;padding:25px}h1{font-size:26px;line-height:1.5}p{line-height:1.9}button{width:100%;font:inherit;font-weight:bold;font-size:18px;background:#155b98;color:white;border:0;border-radius:9px;padding:17px;cursor:pointer;margin-top:20px}.step{color:#155b98;font-weight:bold}svg{width:100%;height:auto}.file{font-size:25px;border:2px solid #b4cede;padding:24px;background:#f2f7fb;border-radius:9px;font-weight:bold}[hidden]{display:none}</style><main><section><span id="step" class="step">起動の案内 1 / 2</span><h1 id="title">前の連携プログラムを閉じてください</h1><p id="text">「CurveDrive Bridge」と書かれた黒い画面が、すでに動いています。その画面の右上の「×」で閉じてください。</p><div id="picture"><svg viewBox="0 0 560 170" role="img" aria-label="CurveDrive Bridgeと書かれた黒い画面の右上の閉じるボタン"><rect x="3" y="3" width="554" height="164" rx="10" fill="#16191e"/><path d="M3 40H557" stroke="#515964"/><text x="22" y="28" fill="white" font-family="sans-serif" font-size="16">CurveDrive Bridge</text><rect x="508" y="5" width="46" height="34" fill="#bd3449"/><text x="524" y="29" fill="white" font-family="sans-serif" font-size="26">×</text><text x="20" y="85" fill="#c1cad5" font-family="sans-serif" font-size="13">黒い連携画面を閉じます</text></svg></div><button id="next">黒い画面を閉じたので、次へ →</button></section></main><script>document.getElementById('next').onclick=function(){document.getElementById('step').textContent='起動の案内 2 / 2';document.getElementById('title').textContent='Open.cmd を開き直してください';document.getElementById('text').textContent='ZIPを展開したフォルダーへ戻り、Open.cmdをダブルクリックしてください。入力画面が開いたら、その画面の案内に沿って進めます。';document.getElementById('picture').innerHTML='<div class="file">Open.cmd ← ダブルクリック</div>';this.hidden=true;};</script></html>
