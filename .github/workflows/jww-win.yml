name: JW_CAD Windows fixture
on:
  push:
    branches: [qa-windows]
permissions:
  contents: read
concurrency:
  group: jww-windows-fixture
  cancel-in-progress: true
jobs:
  fixture:
    strategy:
      fail-fast: false
      matrix:
        release: [825a, 10038]
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/curve-ci/jww.exe
          key: official-jww-${{ matrix.release }}-v1
      - name: Run isolated Windows and JW_CAD check
        shell: cmd
        run: python qa\run.py "${{ matrix.release }}"
      - name: Save synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jww-windows-${{ matrix.release }}
          path: qa-out
          retention-days: 7
