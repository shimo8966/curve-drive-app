name: Standalone Windows app
on:
  push:
    branches: [qa-standalone]
permissions:
  contents: read
jobs:
  field:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and verify field app in real Edge
        shell: cmd
        run: python qa\field\qa\run.py
      - name: Save synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: field-windows
          path: qa-out-field
          retention-days: 7
